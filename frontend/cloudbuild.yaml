steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "--build-arg"
      - "FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "-t"
      - "${_REPO}/nerd-frontend:${_TAG}"
      - "."

images:
  - "${_REPO}/nerd-frontend:${_TAG}"

substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_APP_ID: ""
  _REPO: ""
  _TAG: ""
