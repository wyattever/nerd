# TEMPORARY PROBE -- plan section 8.3 (docs/mirror-promote-plan-11-02-26.md).
# Purpose: find out whether GitHub-hosted runners can fetch ncademi.org (the
# WordPress REST product list, a sample of public product pages, and one
# password-protected page unlock) without being blocked or challenged.
# Delete this workflow, together with the repository secret
# PROBE_NEWSELA_PASSWORD, once the probe has been run.
# It makes at most about 30 GET requests plus one password POST, spaced at the
# scraper's 0.3 second rhythm. It uses no Google Cloud credentials and no actions.
name: "Probe ncademi.org (temporary)"

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ncademi.org
        env:
          PROBE_NEWSELA_PASSWORD: ${{ secrets.PROBE_NEWSELA_PASSWORD }}
        run: |
          python3 -m venv /tmp/probe-venv
          /tmp/probe-venv/bin/pip install --quiet --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.15.0
          /tmp/probe-venv/bin/python - <<'PROBE_PY'
          import os
          import re
          import sys
          import time
          from urllib.parse import urlsplit

          import requests
          from bs4 import BeautifulSoup

          # Mirrors scripts/scrape_ncademi_live.py.
          USER_AGENT = "Mozilla/5.0 (compatible; NCADEMI-directory-audit/5.0)"
          API_BASE = "https://ncademi.org/wp-json/wp/v2"
          POSTPASS_URL = "https://ncademi.org/wp-login.php?action=postpass"
          PAGE_FETCH_DELAY_SECONDS = 0.3
          REQUEST_TIMEOUT_CONNECT_READ = (10, 30)

          NEWSELA_URL = "https://ncademi.org/provide/directory/products/newsela-student-platform/"
          SAMPLE_SIZE = 25
          MAX_CONSECUTIVE_NON_200 = 3
          CHALLENGE_STATUSES = {403, 429, 503}
          CHALLENGE_MARKERS = (
              "just a moment",
              "attention required",
              "captcha",
              "access denied",
              "cf-chl",
              "wordfence",
              "sucuri",
              "you have been blocked",
              "verify you are human",
          )

          challenges = []      # (stage, path, reason)
          statuses = []        # every HTTP status seen
          network_errors = []  # (stage, path, error class)


          def new_session():
              s = requests.Session()
              s.headers.update({"User-Agent": USER_AGENT})
              return s


          def path_of(url):
              return urlsplit(url).path or "/"


          def collapse(text, limit):
              return re.sub(r"\s+", " ", text).strip()[:limit]


          def challenge_reason(resp):
              reasons = []
              if resp.status_code in CHALLENGE_STATUSES:
                  reasons.append(f"status {resp.status_code}")
              if "cf-mitigated" in resp.headers:
                  reasons.append("cf-mitigated header")
              head = resp.content[:4096].decode("utf-8", "replace").lower()
              found = [m for m in CHALLENGE_MARKERS if m in head]
              if found:
                  reasons.append("body markers: " + ", ".join(found))
              return "; ".join(reasons)


          def request(stage, session, method, url, notes_fn=None, **kwargs):
              """Make one request, print one line, run challenge detection. Returns the response or None."""
              start = time.monotonic()
              try:
                  resp = session.request(method, url, timeout=REQUEST_TIMEOUT_CONNECT_READ, **kwargs)
              except requests.exceptions.RequestException as e:
                  ms = int((time.monotonic() - start) * 1000)
                  network_errors.append((stage, path_of(url), type(e).__name__))
                  print(f"{stage} | {method} {path_of(url)} | ERROR | {ms} ms | {type(e).__name__}", flush=True)
                  return None
              ms = int((time.monotonic() - start) * 1000)
              statuses.append(resp.status_code)
              notes = notes_fn(resp) if notes_fn else ""
              reason = challenge_reason(resp)
              if reason:
                  challenges.append((stage, path_of(url), reason))
                  notes = (notes + " | " if notes else "") + "CHALLENGE: " + reason
              print(f"{stage} | {method} {path_of(url)} | {resp.status_code} | {ms} ms | {notes}", flush=True)
              if reason or resp.status_code != 200:
                  print(
                      f"    server={resp.headers.get('Server')!r} via={resp.headers.get('Via')!r} "
                      f"cf-ray-present={'cf-ray' in resp.headers}",
                      flush=True,
                  )
                  body = resp.content[:4096].decode("utf-8", "replace")
                  print(f"    body[:200]={collapse(body, 200)!r}", flush=True)
              return resp


          def has_pw_form(html):
              return BeautifulSoup(html, "html.parser").select_one("form.pw_form") is not None


          def h1_text(html):
              h1 = BeautifulSoup(html, "html.parser").select_one("h1")
              return h1.get_text(strip=True) if h1 else ""


          summary = []  # (stage, result)

          # Stage 1: endpoint resolution.
          s1 = new_session()
          items_url = f"{API_BASE}/products"
          r1 = request("stage1", s1, "GET", f"{API_BASE}/types/product")
          stage1_ok = r1 is not None and r1.status_code == 200
          if stage1_ok:
              try:
                  info = r1.json()
              except ValueError:
                  info = None
                  stage1_ok = False
                  print("stage1 | invalid JSON", flush=True)
              if isinstance(info, dict) and "_links" in info and "wp:items" in info["_links"]:
                  items_url = info["_links"]["wp:items"][0]["href"]
                  print(f"stage1 | items_url from wp:items: {path_of(items_url)}", flush=True)
              else:
                  print(f"stage1 | items_url fallback: {path_of(items_url)}", flush=True)
          summary.append(("1 types/product", f"{r1.status_code if r1 is not None else 'ERROR'} items_url={path_of(items_url)}"))

          # Stage 2: product list, page 1.
          sample = []
          r2 = request("stage2", s1, "GET", f"{items_url}?per_page=100&page=1")
          stage2_ok = False
          if r2 is not None:
              total = r2.headers.get("X-WP-Total")
              pages = r2.headers.get("X-WP-TotalPages")
              items = []
              if r2.status_code == 200:
                  try:
                      items = r2.json()
                  except ValueError:
                      print("stage2 | invalid JSON", flush=True)
              if not isinstance(items, list):
                  items = []
              protected = [i for i in items if isinstance(i, dict) and "post-password-required" in (i.get("class_list") or [])]
              public_links = [
                  i["link"] for i in items
                  if isinstance(i, dict) and i.get("link") and "post-password-required" not in (i.get("class_list") or [])
              ]
              sample = public_links[:SAMPLE_SIZE]
              stage2_ok = r2.status_code == 200 and total is not None and pages is not None
              line = (
                  f"{r2.status_code} X-WP-Total={total} X-WP-TotalPages={pages} "
                  f"items={len(items)} protected={len(protected)} sample={len(sample)}"
              )
              print(f"stage2 | {line}", flush=True)
              summary.append(("2 product list", line))
          else:
              summary.append(("2 product list", "ERROR"))

          # Stage 3: public page sample, fresh cookie jar per page.
          s3_statuses = []
          consecutive_bad = 0
          for idx, url in enumerate(sample):
              if idx:
                  time.sleep(PAGE_FETCH_DELAY_SECONDS)
              r = request(
                  "stage3", new_session(), "GET", url,
                  notes_fn=lambda resp: f"pw_form_absent={not has_pw_form(resp.text)}" if resp.status_code == 200 else "",
              )
              code = r.status_code if r is not None else "ERROR"
              s3_statuses.append(code)
              consecutive_bad = 0 if code == 200 else consecutive_bad + 1
              if consecutive_bad >= MAX_CONSECUTIVE_NON_200:
                  print(f"stage3 | stopping early after {MAX_CONSECUTIVE_NON_200} consecutive non-200 responses", flush=True)
                  break
          hist = {}
          for c in s3_statuses:
              hist[str(c)] = hist.get(str(c), 0) + 1
          ok3 = hist.get("200", 0)
          stage3_ok = bool(sample) and ok3 >= 0.9 * len(sample)
          summary.append(("3 public sample", f"{ok3}/{len(sample)} 200 histogram={hist}"))

          # Stage 4: one password-protected page unlock.
          stage4 = "NOT_RUN"
          s4 = new_session()
          pre = request(
              "stage4", s4, "GET", NEWSELA_URL,
              notes_fn=lambda resp: f"pw_form_present={has_pw_form(resp.text)}" if resp.status_code == 200 else "",
          )
          password = os.environ.get("PROBE_NEWSELA_PASSWORD") or ""
          if not password:
              print("Stage 4 SKIPPED: no password", flush=True)
              stage4 = "SKIPPED"
          elif pre is None or pre.status_code != 200 or not has_pw_form(pre.text):
              stage4 = f"BLOCKED_OR_ERROR (pre-unlock GET {pre.status_code if pre is not None else 'ERROR'}, form not as expected)"
          else:
              post = request(
                  "stage4", s4, "POST", POSTPASS_URL,
                  data={"post_password": password, "Submit": "Submit"},
                  headers={"Referer": NEWSELA_URL},
                  allow_redirects=False,
              )
              del password
              if post is None:
                  stage4 = "BLOCKED_OR_ERROR (POST network error)"
              else:
                  location = post.headers.get("Location")
                  cookie_present = any(c.name.startswith("wp-postpass_") for c in s4.cookies)
                  print(
                      f"stage4 | POST status={post.status_code} location_path={path_of(location) if location else None} "
                      f"wp_postpass_cookie_present={cookie_present}",
                      flush=True,
                  )
                  if post.status_code >= 400:
                      stage4 = f"BLOCKED_OR_ERROR (POST {post.status_code})"
                  else:
                      again = request("stage4", s4, "GET", NEWSELA_URL)
                      if again is None:
                          stage4 = "BLOCKED_OR_ERROR (re-fetch network error)"
                      elif again.status_code == 200 and not has_pw_form(again.text) and h1_text(again.text):
                          stage4 = "UNLOCKED"
                      elif again.status_code == 200 and has_pw_form(again.text):
                          stage4 = "PASSWORD_REJECTED"
                      else:
                          stage4 = f"BLOCKED_OR_ERROR ({again.status_code})"
          summary.append(("4 protected unlock", stage4))

          # Result.
          blocked = bool(challenges) or any(c in (403, 429) for c in statuses)
          base_ok = stage1_ok and stage2_ok and stage3_ok
          if blocked:
              result = "BLOCKED"
          elif base_ok and stage4 == "UNLOCKED":
              result = "PASS"
          elif base_ok and stage4 == "SKIPPED":
              result = "PARTIAL"
          else:
              # Network errors or timeouts without a challenge, and any other failure
              # (e.g. under 90% sample 200s, PASSWORD_REJECTED) without a challenge.
              result = "INCONCLUSIVE"

          lines = ["stage                | result", "---------------------+-------"]
          lines += [f"{name:<20} | {res}" for name, res in summary]
          lines.append(f"challenges flagged   | {len(challenges)}")
          for stage, p, reason in challenges:
              lines.append(f"  {stage} {p}: {reason}")
          lines.append(f"network errors       | {len(network_errors)}")
          for stage, p, err in network_errors:
              lines.append(f"  {stage} {p}: {err}")
          lines.append(f"PROBE RESULT: {result}")
          text = "\n".join(lines)
          print("\n" + text, flush=True)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write("```\n" + text + "\n```\n")

          sys.exit(0 if result in ("PASS", "PARTIAL") else 1)
          PROBE_PY
